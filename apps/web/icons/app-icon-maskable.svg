<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Storyshelf: book spines on a shelf, their heights a sound wave, the last one leaning. Maskable: scaled into the safe zone. -->
  <rect width="512" height="512" fill="#111418"/>
  <g transform="translate(256 259) scale(.8) translate(-256 -259)">
  <mask id="bands">
    <rect width="512" height="512" fill="#fff"/>
    <rect y="300" width="512" height="10"/>
    <rect y="320" width="512" height="5"/>
  </mask>
  <g fill="#f5f7fa" mask="url(#bands)">
    <rect x="112" y="236" width="46" height="132" rx="9" opacity=".55"/>
    <rect x="168" y="178" width="46" height="190" rx="9" opacity=".75"/>
    <rect x="224" y="124" width="56" height="244" rx="9"/>
    <rect x="290" y="164" width="46" height="204" rx="9" opacity=".8"/>
    <rect x="352" y="214" width="46" height="154" rx="9" opacity=".6" transform="rotate(14 398 368)"/>
  </g>
  <rect x="96" y="380" width="320" height="14" rx="7" fill="#f5f7fa" opacity=".3"/>
</g>
</svg>
